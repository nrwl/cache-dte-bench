name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

# Every command runs locally on its own runner. Nx Cloud is used for remote
# caching only: there is no `nx start-ci-run` and distributed task execution
# is explicitly disabled, so each job's duration reflects the work (or cache
# hits) on that single VM.
env:
  NX_CLOUD_DISTRIBUTED_EXECUTION: false
  # Part of every task hash (nx.json sharedGlobals), so the two
  # workflows never share cache entries with each other.
  CI_RUNNER: GHA

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx nx affected -t build --parallel=4

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx nx affected -t typecheck --parallel=4

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx nx affected -t lint --parallel=4

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx nx affected -t test --parallel=4

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Check Hardware Specs
        run: |
          echo "=== CPU CORES ==="
          nproc
          echo "=== RAM MEMORY ==="
          free -h
      - run: npx nx format:check --base="remotes/origin/main"
      - run: npx nx sync:check
      - run: npx nx validate

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx nx affected -t e2e --parallel=1 --output-style=stream -- --workers=1
